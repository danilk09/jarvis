<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Workspace Manager</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --card:     #16161f;
    --border:   #252535;
    --border2:  #32324a;
    --accent:   #6c63ff;
    --accent2:  #a78bfa;
    --green:    #34d399;
    --amber:    #fbbf24;
    --red:      #f87171;
    --text:     #e8e8f0;
    --muted:    #6b6b8a;
    --subtle:   #1e1e2e;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    letter-spacing: -1px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  header h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }

  .header-actions { margin-left: auto; display: flex; gap: 10px; }

  /* ── Buttons ── */
  .btn {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #7c74ff; }

  .btn-ghost {
    background: transparent;
    color: var(--text);
  }
  .btn-ghost:hover { background: var(--subtle); border-color: var(--border2); }

  .btn-danger {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 4px 8px;
    font-size: 12px;
  }
  .btn-danger:hover { color: var(--red); border-color: var(--red); background: rgba(248,113,113,0.08); }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 77px);
  }

  /* ── Sidebar ── */
  aside {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 0;
    overflow-y: auto;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0 20px;
    margin-bottom: 8px;
  }

  .ws-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.1s;
    border-left: 2px solid transparent;
    user-select: none;
  }
  .ws-item:hover { background: var(--subtle); }
  .ws-item.active {
    background: var(--subtle);
    border-left-color: var(--accent);
  }

  .ws-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .ws-item.active .ws-dot { background: var(--accent2); }

  .ws-name {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ws-count {
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .add-ws-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent2);
    cursor: pointer;
    width: 100%;
    background: none;
    border: none;
    transition: background 0.1s;
    letter-spacing: 0.02em;
    font-family: 'Syne', sans-serif;
  }
  .add-ws-btn:hover { background: var(--subtle); }

  /* ── Main ── */
  main {
    padding: 32px;
    overflow-y: auto;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    color: var(--muted);
    gap: 12px;
    text-align: center;
  }

  .empty-icon {
    width: 56px; height: 56px;
    border: 1.5px dashed var(--border2);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin-bottom: 8px;
  }

  /* ── Workspace Editor ── */
  .ws-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }

  .ws-title-area { flex: 1; }

  .ws-name-input {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    background: none;
    border: none;
    color: var(--text);
    width: 100%;
    outline: none;
    border-bottom: 2px solid transparent;
    padding-bottom: 4px;
    transition: border-color 0.15s;
    letter-spacing: 0.02em;
  }
  .ws-name-input:focus { border-bottom-color: var(--accent); }
  .ws-name-input::placeholder { color: var(--muted); }

  .ws-desc-input {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    background: none;
    border: none;
    color: var(--muted);
    width: 100%;
    outline: none;
    margin-top: 6px;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color 0.15s;
  }
  .ws-desc-input:focus { border-bottom-color: var(--border2); color: var(--text); }
  .ws-desc-input::placeholder { color: var(--border2); }

  /* ── Items ── */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .items-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

  .item-row {
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    transition: border-color 0.15s;
  }
  .item-row:hover { border-color: var(--border2); }

  .type-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 5px;
    text-align: center;
    white-space: nowrap;
  }

  .type-url    { background: rgba(108,99,255,0.15); color: #a78bfa; }
  .type-vscode { background: rgba(52,211,153,0.12); color: #34d399; }
  .type-file   { background: rgba(251,191,36,0.12);  color: #fbbf24; }
  .type-app    { background: rgba(248,113,113,0.12); color: #f87171; }

  .item-type-select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    width: 90px;
  }

  .item-path-input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: none;
    border: none;
    color: var(--text);
    width: 100%;
    outline: none;
  }
  .item-path-input::placeholder { color: var(--muted); }

  .add-item-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent2);
    background: none;
    border: 1.5px dashed var(--border2);
    border-radius: 10px;
    padding: 10px 16px;
    width: 100%;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .add-item-btn:hover { border-color: var(--accent); background: rgba(108,99,255,0.06); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--green); color: var(--green); }

  /* ── JSON Panel ── */
  .json-panel {
    margin-top: 32px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .json-header {
    background: var(--subtle);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .json-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .json-output {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #a5b4fc;
    background: var(--card);
    padding: 16px;
    white-space: pre;
    overflow-x: auto;
    line-height: 1.6;
    max-height: 280px;
    overflow-y: auto;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  /* ── Tip box ── */
  .tip {
    background: rgba(108,99,255,0.08);
    border: 1px solid rgba(108,99,255,0.25);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--accent2);
    line-height: 1.6;
    margin-top: 20px;
  }
  .tip strong { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo">J</div>
  <h1>JARVIS <span>Workspace Manager</span></h1>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="copyJSON()">⬇ Copy JSON</button>
    <button class="btn btn-primary" onclick="saveAll()">✓ Save workspaces.json</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-label">Workspaces</div>
    <div id="ws-list"></div>
    <button class="add-ws-btn" onclick="addWorkspace()">＋ New workspace</button>
  </aside>

  <main id="main-area">
    <div class="empty-state">
      <div class="empty-icon">⚡</div>
      <div style="font-size:15px; font-weight:600; color:var(--text);">No workspace selected</div>
      <div style="font-size:13px;">Click a workspace or create a new one</div>
    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let data = {};
let selected = null;

// ── Seed with starter data ──────────────────────────────────────────────────
const STARTER = {
  "react project": {
    description: "My main React app",
    items: [
      { type: "vscode", path: "/Users/you/projects/my-react-app" },
      { type: "url",    path: "http://localhost:3000" },
      { type: "url",    path: "https://react.dev" }
    ]
  },
  "work morning": {
    description: "Daily work setup",
    items: [
      { type: "url", path: "https://gmail.com" },
      { type: "url", path: "https://calendar.google.com" },
      { type: "app", path: "Slack" }
    ]
  }
};

// ── Load ────────────────────────────────────────────────────────────────────
function load() {
  const saved = localStorage.getItem('jarvis_workspaces');
  data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(STARTER));
  renderSidebar();
}

function save() {
  localStorage.setItem('jarvis_workspaces', JSON.stringify(data));
}

// ── Sidebar ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('ws-list');
  list.innerHTML = '';
  const keys = Object.keys(data);
  if (keys.length === 0) {
    list.innerHTML = '<div style="padding:10px 20px;font-size:12px;color:var(--muted);">No workspaces yet</div>';
    return;
  }
  keys.forEach(name => {
    const ws = data[name];
    const el = document.createElement('div');
    el.className = 'ws-item' + (selected === name ? ' active' : '');
    el.onclick = () => selectWorkspace(name);
    el.innerHTML = `
      <div class="ws-dot"></div>
      <div class="ws-name">${name}</div>
      <div class="ws-count">${(ws.items||[]).length}</div>
    `;
    list.appendChild(el);
  });
}

// ── Select ───────────────────────────────────────────────────────────────────
function selectWorkspace(name) {
  selected = name;
  renderSidebar();
  renderEditor();
}

// ── Editor ───────────────────────────────────────────────────────────────────
function renderEditor() {
  if (!selected || !data[selected]) return;
  const ws = data[selected];
  const items = ws.items || [];

  document.getElementById('main-area').innerHTML = `
    <div class="ws-header">
      <div class="ws-title-area">
        <input class="ws-name-input" id="ws-name" value="${selected}" placeholder="workspace name" />
        <input class="ws-desc-input" id="ws-desc" value="${ws.description||''}" placeholder="Optional description..." />
      </div>
      <button class="btn btn-danger" onclick="deleteWorkspace('${selected}')">✕ Delete</button>
    </div>

    <div class="section-title">Items — opened when you say this workspace name</div>
    <div class="items-list" id="items-list"></div>
    <button class="add-item-btn" onclick="addItem()">＋ Add URL, file, app, or VSCode path</button>

    <div class="tip">
      <strong>Voice triggers:</strong> Say <em>"open [workspace name]"</em> or just the name —
      Claude will fuzzy-match it. Multiple workspaces can be chained: <em>"open work morning and my react project"</em>
    </div>

    <div class="divider"></div>
    <div class="json-panel">
      <div class="json-header">
        <span class="json-label">workspaces.json preview</span>
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="copyJSON()">Copy all</button>
      </div>
      <div class="json-output" id="json-out"></div>
    </div>
  `;

  document.getElementById('ws-name').addEventListener('change', onNameChange);
  document.getElementById('ws-desc').addEventListener('input', onDescChange);

  renderItems();
  updateJSON();
}

function renderItems() {
  const ws = data[selected];
  const items = ws.items || [];
  const list = document.getElementById('items-list');
  if (!list) return;

  list.innerHTML = '';
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <select class="item-type-select" onchange="updateItemType(${i}, this.value)">
        <option value="url"    ${item.type==='url'    ? 'selected':''}>url</option>
        <option value="vscode" ${item.type==='vscode' ? 'selected':''}>vscode</option>
        <option value="file"   ${item.type==='file'   ? 'selected':''}>file</option>
        <option value="app"    ${item.type==='app'    ? 'selected':''}>app</option>
      </select>
      <input class="item-path-input" value="${item.path||''}" 
             placeholder="${placeholder(item.type)}"
             oninput="updateItemPath(${i}, this.value)" />
      <button class="btn btn-danger" onclick="removeItem(${i})">✕</button>
    `;
    list.appendChild(row);
  });
}

function placeholder(type) {
  if (type === 'url')    return 'https://...';
  if (type === 'vscode') return '/path/to/project';
  if (type === 'file')   return '/path/to/file.pdf';
  if (type === 'app')    return 'Spotify / Slack / ...';
  return '';
}

// ── Mutations ────────────────────────────────────────────────────────────────
function onNameChange(e) {
  const newName = e.target.value.trim().toLowerCase();
  if (!newName || newName === selected) return;
  if (data[newName]) { toast('Name already taken', false); return; }
  data[newName] = data[selected];
  delete data[selected];
  selected = newName;
  save(); renderSidebar(); renderEditor();
}

function onDescChange(e) {
  data[selected].description = e.target.value;
  save(); updateJSON();
}

function addWorkspace() {
  const base = 'new workspace';
  let name = base;
  let i = 2;
  while (data[name]) { name = base + ' ' + i++; }
  data[name] = { description: '', items: [] };
  save(); renderSidebar(); selectWorkspace(name);
  setTimeout(() => document.getElementById('ws-name')?.focus(), 50);
}

function deleteWorkspace(name) {
  if (!confirm(`Delete workspace "${name}"?`)) return;
  delete data[name];
  selected = Object.keys(data)[0] || null;
  save(); renderSidebar();
  if (selected) renderEditor();
  else document.getElementById('main-area').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⚡</div>
      <div style="font-size:15px;font-weight:600;color:var(--text);">No workspace selected</div>
      <div style="font-size:13px;">Create one to get started</div>
    </div>`;
}

function addItem() {
  if (!data[selected].items) data[selected].items = [];
  data[selected].items.push({ type: 'url', path: '' });
  save(); renderItems(); updateJSON();
}

function removeItem(i) {
  data[selected].items.splice(i, 1);
  save(); renderItems(); updateJSON();
}

function updateItemType(i, type) {
  data[selected].items[i].type = type;
  save(); renderItems(); updateJSON();
}

function updateItemPath(i, val) {
  data[selected].items[i].path = val;
  save(); updateJSON();
}

// ── JSON output ──────────────────────────────────────────────────────────────
function updateJSON() {
  const el = document.getElementById('json-out');
  if (el) el.textContent = JSON.stringify(data, null, 2);
}

function copyJSON() {
  navigator.clipboard.writeText(JSON.stringify(data, null, 2));
  toast('JSON copied to clipboard ✓');
}

function saveAll() {
  copyJSON();
  toast('Copied! Paste into workspaces.json ✓');
}

// ── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (ok ? ' success' : '');
  setTimeout(() => el.className = 'toast', 2600);
}

// ── Init ─────────────────────────────────────────────────────────────────────
load();
if (Object.keys(data).length > 0) selectWorkspace(Object.keys(data)[0]);
</script>
</body>
</html>
