# WirePlumber 0.5+ (Raspberry Pi OS Trixie). Installed by scripts/pocket/setup_bench.sh into
# ~/.config/wireplumber/wireplumber.conf.d/
#
# - hfp_ag: the Pi acts as the "phone" side of a headset call, so the AirPods mic works
# - mSBC: wideband (16 kHz) headset audio when the AirPods and the chip agree on it
# - seat monitoring off: on a headless Pi (SSH, no desktop) WirePlumber would otherwise
#   switch Bluetooth audio off because no user is "active" on a seat
# - no auto-switch: the bench (and later the pocket client) chooses music vs headset mode

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag hsp_ag ]
  bluez5.hfphsp-backend = "native"
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
